<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUTOCOM - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fb; color: #101828; text-align: center; padding: 24px;
    }
    .card { max-width: 380px; }
    .logo { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; margin: 0 auto 20px; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #475467; margin: 0 0 20px; }
    a { display: inline-block; background: #0080ff; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 12px; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/icon-192.png" alt="AUTOCOM" /></div>
    <h1>Você está offline</h1>
    <p>Esta tela ainda não foi carregada no dispositivo. Conecte-se à internet uma vez para que o aplicativo fique disponível offline.</p>
    <a href="/">Tentar abrir a tela inicial</a>
  </div>
</body>
</html>
